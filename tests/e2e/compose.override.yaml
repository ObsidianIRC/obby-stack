services:
  obbyircd:
    env_file: !override
      - path: ${E2E_ENV_FILE}
        required: true
    ports: !override
      - "127.0.0.1::6697"
      - "127.0.0.1::8080"
    labels: !reset []
    healthcheck:
      start_period: 5s
  obby-api:
    env_file: !override
      - path: ${E2E_ENV_FILE}
        required: true
    ports: !reset []
    labels: !reset []
